<!DOCTYPE html>
<html lang="es">
<head>

    <title>Ejercicio 1 - Tabla sencilla</title>

        td, th { border: 1px solid #CCC; }
        table { border: 1px solid black; }
    </style>
</head>

            <th>Album</th>

        </tr>
        <tr>
            <td>Revolver</td>
            <td>1966</td>
        </tr>
        <tr>
            <td>Sgt. Pepper's</td>
            <td>1967</td>
        </tr>
        <tr>
            <td>The White Album</td>
            <td>1968</td>
        </tr>
        <tr>
            <td>Abbey Road</td>
            <td>1969</td>
        </tr>
    </table>
</body>
</html>
